<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#07191c" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<link rel="icon" type="image/png" href="/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Trirong:wght@400;600&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet" />
<title>ปฐมเทพ</title>
<script>
// ตัวดักข้อผิดพลาดตอนเริ่มเกม — เกมที่พังแล้วขึ้นหน้าขาวเปล่าคือสิ่งที่แก้ไม่ได้เลย
// ทั้งสำหรับผู้เล่นบน iPad และสำหรับคนที่ต้องมาไล่หาสาเหตุทีหลัง
// ต้องเขียนด้วยของพื้นฐานล้วน เพราะมันต้องทำงานได้แม้ตอนที่ทุกอย่างอื่นพัง
(function () {
  var shown = false;
  function show(what, e) {
    if (shown) return; shown = true;
    var d = document.createElement("div");
    d.setAttribute("style", "position:fixed;inset:0;z-index:99999;padding:24px;overflow:auto;" +
      "background:#140f12;color:#f0e6d8;font:14px/1.7 ui-monospace,monospace;white-space:pre-wrap");
    d.textContent = "เกมเริ่มไม่ขึ้น (" + what + ")\n\n" +
      ((e && (e.stack || e.message)) || String(e)) +
      "\n\nWebGL: " + (function () {
        try { var c = document.createElement("canvas");
              return (c.getContext("webgl2") || c.getContext("webgl")) ? "ใช้ได้" : "ใช้ไม่ได้"; }
        catch (x) { return "เช็กไม่ได้: " + x; }
      })();
    (document.body || document.documentElement).appendChild(d);
  }
  addEventListener("error", function (e) { show("error", e.error || e.message); });
  addEventListener("unhandledrejection", function (e) { show("promise", e.reason); });
})();
</script>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat faith"><b id="sFaith">0</b><span id="sFaithCap">/0</span></div>
    <div class="stat"><b id="sPop">0</b><span id="sGoal">/ 0</span><span>ผู้ศรัทธา</span></div>
    <div class="stat"><b id="sYear">0</b><span>วัน</span></div>
    <div class="grow"></div>
    <button class="iconbtn" id="bSpeed">1×</button>
    <button class="iconbtn" id="bSound">เสียงเปิด</button>
    <button class="iconbtn" id="bGen">สัตว์</button>
    <button class="iconbtn" id="bMenu">เมนู</button>
  </div>
  <div id="align"><div id="alignPin"></div></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="guide" class="hidden"></div>
    <div id="ticker"></div>
    <button id="zoomOut" class="hidden">ถอยออก</button>
    <button id="bGrab" data-on="0">หยิบของ</button>
    <div id="genome" class="hidden"></div>
    <div id="inspect" class="hidden"></div>
    <div id="menu" class="hidden"></div>
    <div id="alerts"></div>
    <div id="firsthint" class="hidden"></div>
    <div id="reign" class="hidden"></div>
    <div id="advisors"><div class="adv kind"></div><div class="adv cruel"></div></div>
  </div>
  <div id="pet">
    <div id="petFace">?</div>
    <div id="petInfo">
      <div id="petAct">—</div>
      <div id="petBars">
        <div class="bar" title="แรง"><i id="barE"></i></div>
        <div class="bar" title="อายุที่เหลือ"><i id="barA"></i></div>
        <div class="bar" title="ความผูกพัน"><i id="barB"></i></div>
      </div>
    </div>
    <div id="cmds">
      <button class="cmd" id="cStay" title="ให้อยู่ตรงจุดที่แตะ">อยู่นี่</button>
      <button class="cmd" id="cEat" title="ให้ไปหากินตรงจุดที่แตะ">กินตรงนี้</button>
      <button class="cmd" id="cGo" title="เรียกไปยังจุดที่แตะ">ไปตรงนั้น</button>
      <button class="cmd" id="cLift" title="ยกมันขึ้นมาแล้ววางลงตรงจุดที่แตะ">ยกไปวาง</button>
    </div>
    <button class="teach good" id="bPraise">✦</button>
    <button class="teach bad" id="bScold">✕</button>
  </div>
  <div id="spells"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
